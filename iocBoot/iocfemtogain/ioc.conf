# ioc.conf — Femto Gain Controller Rev.2 site settings
# KEY=VALUE, one per line.  Put comments on their own lines (systemd reads
# this file too and does not strip trailing comments).
# Apply changes with:  femtogainctl restart

# PV name prefix — must be unique per unit.  PV = <PREFIX><CHn_NAME>Gain
PREFIX=GC01:

# Channel signal names for CH1..CH4 (Rev.1 naming: Io It If Ir Im).
# PV = <PREFIX><NAME>Gain etc.  Start with a letter, [A-Za-z0-9_-], max 16
# chars, all four different.  Change with:  femtogainctl chname ...
CH1_NAME=Io
CH2_NAME=If
CH3_NAME=It
CH4_NAME=Ir

# Gain code 0-6 (E3..E9) that ALL channels take at every IOC start.
# Gains are not saved (no autosave); keep 0 (E3, lowest gain) for safety.
DEFAULT_GAIN=0

# Seconds the overload latch and counter ignore the overload input after a
# gain change (the amplifier pulses its overload output for 0.1-0.25 s when
# switching to/from the highest gain).  <S>Overload itself is not masked.
OVL_BLANK=0.5

# procServ console:  telnet localhost <port>
CONSOLE_PORT=20000

GPIOCHIP=gpiochip0

# Gain outputs, gpiochip0 line numbers (header pin in the comment above each)
# CH1: pins 7, 11, 12
CH1_G0_LINE=28
CH1_G1_LINE=53
CH1_G2_LINE=54
# CH2: pins 13, 15, 16
CH2_G0_LINE=63
CH2_G1_LINE=52
CH2_G2_LINE=30
# CH3: pins 18, 19, 21
CH3_G0_LINE=31
CH3_G1_LINE=56
CH3_G2_LINE=57
# CH4: pins 22, 23, 24
CH4_G0_LINE=62
CH4_G1_LINE=59
CH4_G2_LINE=58

# Overload inputs (active-LOW): pins 26, 29, 31, 32
OVL1_LINE=55
OVL2_LINE=40
OVL3_LINE=41
OVL4_LINE=50

# Factory-reset jumper: header pin 36 to GND pin 34, internal pull-up
RESET_LINE=51
RESET_PIN=36
RESET_HOLD_SEC=5

# Factory defaults (reset jumper / clone-prep only)
DEFAULT_IP=10.0.147.1
DEFAULT_NETMASK=255.255.255.0
DEFAULT_GATEWAY=10.0.147.99
DEFAULT_DNS=8.8.8.8
DEFAULT_USER=root
DEFAULT_PASSWORD=femto
